[package]
name = "tlsurl-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
wreq = { path = "../..", features = ["cookies", "ws", "stream", "socks", "multipart", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-serde"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
tokio = { version = "1", features = ["sync", "macros", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
wreq = { path = "../..", features = ["prefix-symbols"] }
