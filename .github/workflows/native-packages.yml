name: Native packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bindings/**'
      - 'crates/**'
      - 'src/**'
      - 'Cargo.*'
      - 'scripts/build_native.py'
      - 'tests/bindings/**'
      - '.github/workflows/native-packages.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            container: ''
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            container: ''
          - target: aarch64-apple-darwin
            runner: macos-15
            container: ''
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          yum install -y clang cmake perl nasm git
          echo /opt/python/cp313-cp313/bin >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          components: rustfmt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows assembler
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      - name: Python build tools
        run: python -m pip install maturin==1.15.0 libclang==18.1.1 ninja==1.13.2
      - name: Build packages
        if: runner.os != 'Windows'
        run: python scripts/build_native.py
      - name: Build Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/build_native.py
      - name: Install packaged artifacts
        run: |
          python -m pip install --no-index --only-binary=:all: --find-links dist/wheels tlsurl
          mkdir -p dist/consumer
          cd dist/consumer
          npm init -y
          npm install --ignore-scripts ../npm/tlsurl-0.1.0.tgz
      - name: Test installed packages
        run: python tests/bindings/smoke.py --node-module dist/consumer/node_modules/tlsurl --https
      - uses: actions/upload-artifact@v4
        with:
          name: tlsurl-${{ matrix.target }}
          path: |
            dist/wheels/*.whl
            dist/npm/*.tgz
          if-no-files-found: error
