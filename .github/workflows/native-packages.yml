name: Native packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bindings/**'
      - 'crates/**'
      - 'src/**'
      - 'Cargo.*'
      - 'scripts/**'
      - 'tests/bindings/**'
      - '.github/workflows/native-packages.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: &platforms
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            container: ''
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            container: ''
          - target: aarch64-apple-darwin
            runner: macos-15
            container: ''
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          yum install -y clang cmake perl nasm git
          echo /opt/python/cp313-cp313/bin >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          components: rustfmt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows assembler
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
      - name: Python build tools
        run: python -m pip install maturin==1.15.0 libclang==18.1.1 ninja==1.13.2
      - name: Build packages
        if: runner.os != 'Windows'
        run: python scripts/build_native.py
      - name: Build Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/build_native.py
      - name: Audit native artifacts
        if: runner.os != 'Windows'
        run: python scripts/audit_native.py --artifacts dist --output dist/audit/native-audit-${{ matrix.platform.target }}.json
      - name: Audit Windows native artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/audit_native.py --artifacts dist --output dist/audit/native-audit-${{ matrix.platform.target }}.json
      - name: Core cancellation regressions
        if: runner.os != 'Windows'
        run: cargo test --release --locked -p tlsurl-core --lib
      - name: Windows core cancellation regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --release --locked -p tlsurl-core --lib
      - name: Install packaged artifacts
        run: |
          python -m pip install --no-index --only-binary=:all: --find-links dist/wheels tlsurl
          python tests/bindings/install_npm.py --artifacts dist/npm --consumer dist/consumer
      - name: Test installed packages
        run: |
          npm ci --prefix tests/bindings --ignore-scripts --omit=optional --no-audit
          python tests/bindings/smoke.py --node-module dist/consumer/node_modules/tlsurl --https
          python tests/bindings/protocol.py --node-module dist/consumer/node_modules/tlsurl
          python tests/bindings/stream.py --node-module dist/consumer/node_modules/tlsurl
          python tests/bindings/upload.py --node-module dist/consumer/node_modules/tlsurl
          python tests/bindings/websocket.py --node-module dist/consumer/node_modules/tlsurl
      - uses: actions/upload-artifact@v4
        with:
          name: tlsurl-${{ matrix.platform.target }}
          path: |
            dist/wheels/*.whl
            dist/npm/*.tgz
            dist/audit/*.json
          if-no-files-found: error

  collect:
    name: Validate release artifacts
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: tlsurl-*
          path: dist/download
      - run: python tests/bindings/test_audit.py
      - run: python scripts/collect_native.py --source dist/download --destination dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: native-release
          path: dist/release/*
          if-no-files-found: error

  compatibility:
    name: ${{ matrix.platform.target }} / Python ${{ matrix.python }} / Node 22+24
    needs: collect
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        platform: *platforms
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select manylinux Python
        if: runner.os == 'Linux'
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          tag="cp${PYTHON_VERSION//./}"
          echo "/opt/python/$tag-$tag/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: native-release
          path: dist/release
      - name: Install precompiled wheel
        run: |
          python --version
          python -m pip install --no-index --only-binary=:all: --find-links dist/release tlsurl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node 22 automatic selection and protocol tests
        run: |
          node --version
          python tests/bindings/install_npm.py --artifacts dist/release --consumer dist/node22
          npm ci --prefix tests/bindings --ignore-scripts --omit=optional --no-audit
          python tests/bindings/smoke.py --node-module dist/node22/node_modules/tlsurl --https
          python tests/bindings/protocol.py --node-module dist/node22/node_modules/tlsurl
          python tests/bindings/stream.py --node-module dist/node22/node_modules/tlsurl
          python tests/bindings/upload.py --node-module dist/node22/node_modules/tlsurl
          python tests/bindings/websocket.py --node-module dist/node22/node_modules/tlsurl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node 24 automatic selection and protocol tests
        run: |
          node --version
          python tests/bindings/install_npm.py --artifacts dist/release --consumer dist/node24
          python tests/bindings/smoke.py --node-module dist/node24/node_modules/tlsurl --https
          python tests/bindings/protocol.py --node-module dist/node24/node_modules/tlsurl
          python tests/bindings/stream.py --node-module dist/node24/node_modules/tlsurl
          python tests/bindings/upload.py --node-module dist/node24/node_modules/tlsurl
          python tests/bindings/websocket.py --node-module dist/node24/node_modules/tlsurl
