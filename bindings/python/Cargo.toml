[package]
name = "tlsurl-python"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
tlsurl-core = { path = "../../crates/tlsurl-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
